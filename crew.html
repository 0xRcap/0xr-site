<style>
  .sc { font-style: normal; opacity: 0.45; }
  .page p:not(.creed) { max-width: 34rem; margin: 0 0 1.1rem; color: var(--ink-soft); }
  .intro {
    font-size: clamp(1.05rem, 3.4vw, 1.25rem); line-height: 1.55;
    max-width: 34rem; margin: 0 0 clamp(2.6rem, 8vw, 4rem); color: var(--ink-soft);
  }

  /* ── the six, as a grid of doors ── */
  .roster {
    display: grid; gap: clamp(1.6rem, 5vw, 2.8rem) clamp(1.4rem, 4vw, 2.4rem);
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr));
  }
  .mate {
    display: block; text-align: left; min-width: 0; cursor: pointer;
    background: none; border: 0; padding: 0; font: inherit; color: inherit;
  }
  .mate .fig { display: block; margin: 0 0 0.6rem; image-rendering: pixelated; }
  .mate b {
    display: block; font-family: var(--mono); font-weight: normal;
    font-size: var(--t-mono); letter-spacing: 0.1em; color: var(--ink); margin-bottom: 0.3rem;
  }
  .mate em {
    display: block; font-style: normal; font-family: var(--display);
    font-size: clamp(1.05rem, 3.2vw, 1.3rem); line-height: 1.2; color: var(--ink);
  }
  .mate span {
    display: block; font-family: var(--mono); font-size: var(--t-micro);
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--tone); margin-top: 0.3rem;
  }
  .mate:hover span, .mate:focus-visible span { color: var(--ink); }
  /* clicking one should not draw a box around it; a keyboard still gets a ring */
  .mate:focus { outline: none; }
  .mate:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 2px; }
  [data-state="soon"] b, [data-state="soon"] em, [data-state="soon"] span { color: var(--tone); }

  /* ── the dialogue bubble: the figure speaks, the page does not go dark ──
     Anchored above whoever was clicked, with a tail pointing back down at
     them, and the line typed out rather than pasted in. */
  .stage { position: relative; }
  .bubble {
    position: absolute; z-index: 30; width: min(23rem, calc(100vw - 2 * var(--pad)));
    background: var(--ink); color: var(--card-ink);
    border-radius: 10px; padding: 0.85rem 1rem 0.95rem;
    transform-origin: 50% 100%; transform: translate(-50%, 0) scale(0.94);
    opacity: 0; transition: opacity 0.16s ease, transform 0.16s cubic-bezier(.22,1.2,.4,1);
    pointer-events: none;
  }
  .bubble.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
  /* the tail, drawn as a square rotated into a diamond so its two lower
     edges read as a point aimed at the figure */
  .bubble::after {
    content: ""; position: absolute; bottom: -5px; left: var(--tail, 50%);
    width: 12px; height: 12px; margin-left: -6px;
    background: var(--ink); transform: rotate(45deg); border-radius: 2px;
  }
  .page .bubble .who {
    margin: 0 0 0.3rem; font-family: var(--mono); font-size: var(--t-micro);
    letter-spacing: 0.14em; color: var(--card-tone); max-width: none;
  }
  .page .bubble .say {
    margin: 0; font-size: var(--t-small); line-height: 1.5;
    color: var(--card-ink); max-width: none; min-height: 1.5em;
  }
  .bubble .say::after {
    content: "\25AE"; margin-left: 0.15em; opacity: 0.65;
    animation: blink 1s steps(1) infinite;
  }
  .bubble.done .say::after { content: none; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .bubble { transition: none; }
    .bubble .say::after { animation: none; }
  }

  <script defer>
  /* ── the roster, and the bubble each figure speaks from ──
     No modal and no scrim: a game puts the words next to whoever said them.
     The bubble is one element, moved and refilled, so only one can be open. */
  addEventListener("DOMContentLoaded", () => {
    if (!window.crew3d || !window.crewModels) return;
    const SAY = {
        "ye": "I do brand identity. I find the name, draw the mark, set the type and the colour, and write the guidelines other people build inside. I own what is allowed to change and what never does.",
        "quent": "I do film. I write the script, build the shot list, shoot it and cut it, whether the piece is a launch film, an ad or a month of vertical cuts. I decide what the camera is on, how long you sit in a shot, and what never makes it in.",
        "jean": "I do art direction. I write the look down before anything is made, in hex values, lens millimetres and a named film stock, and the same document governs the film, the photographs, the site and the clothes. Then I judge what comes back and throw out what drifted.",
        "frank": "I do copywriting. I write the names and the taglines, the film scripts, the posts, the site pages, and the proposal with the price at the bottom. I choose what it says first, what it never says, and how long it is allowed to run.",
        "steve": "I do product design. I lay out what the product does and in what order: the flows, the screens, the checkout, and the first run before anybody has any data. I decide what goes on the first screen and what waits.",
        "kim": "I do distribution. I build the calendar, choose the channels, shape the launch as an event, and put the partners and the paid behind it. I set what goes out on which day, what gets held back, and what the numbers change next week."
    };
    const stage  = document.querySelector(".stage");
    const bubble = document.getElementById("bubble");
    const who    = bubble.querySelector(".who");
    const say    = bubble.querySelector(".say");
    const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let speaking = null, timer = 0, current = null;

    const handles = [...document.querySelectorAll(".roster [data-crew]")].map((btn) => {
      const m = window.crewModels[btn.dataset.crew];
      return m ? crew3d.register(btn.querySelector("canvas"), m, { scale: 4 }) : null;
    }).filter(Boolean);
    crew3d.neighbours(handles);

    const hush = () => {
      clearTimeout(timer);
      bubble.classList.remove("on", "done");
      current = null;
      setTimeout(() => { if (!current) bubble.hidden = true; }, 180);
    };

    /* typed, not pasted: the line arrives at reading speed, and a second
       click on the same figure finishes it rather than restarting */
    const type = (text) => {
      if (REDUCED) { say.textContent = text; bubble.classList.add("done"); return; }
      let i = 0;
      say.textContent = "";
      const step = () => {
        say.textContent = text.slice(0, ++i);
        if (i < text.length) timer = setTimeout(step, text[i - 1] === "." ? 90 : 16);
        else bubble.classList.add("done");
      };
      step();
    };

    const speak = (btn) => {
      const k = btn.dataset.crew;
      if (current === k) {                      /* second click: finish or close */
        if (!bubble.classList.contains("done")) {
          clearTimeout(timer); say.textContent = SAY[k]; bubble.classList.add("done");
        } else hush();
        return;
      }
      current = k;
      who.innerHTML = "{&nbsp;" + k.toUpperCase() + "&nbsp;}";
      bubble.hidden = false;
      bubble.classList.remove("done");

      /* place it above the figure, tail on the figure's centre, and keep the
         box inside the stage even when the speaker is at either edge.
         Measured off rects, not offsetLeft: the canvas is positioned against
         the stage, not against its button, so the two would double count. */
      const sr  = stage.getBoundingClientRect();
      const fr  = btn.querySelector("canvas").getBoundingClientRect();
      const cx  = fr.left - sr.left + fr.width / 2;
      bubble.style.left = "0px";
      bubble.style.bottom = (sr.bottom - fr.top + 14) + "px";
      const half = bubble.offsetWidth / 2;
      const x = Math.max(half, Math.min(cx, sr.width - half));
      bubble.style.left = x + "px";
      bubble.style.setProperty("--tail", (cx - x + half) + "px");

      void bubble.offsetHeight;
      bubble.classList.add("on");
      type(SAY[k]);
    };

    for (const btn of document.querySelectorAll(".roster [data-crew]")) {
      btn.addEventListener("click", (e) => { e.stopPropagation(); speak(btn); });
    }
    document.addEventListener("click", hush);
    addEventListener("keydown", (e) => { if (e.key === "Escape") hush(); });
    addEventListener("resize", hush);
  });
  </script>
