};
const INK = "#0E0D0B", PAPER = "#FAF8F4", TONE = "#8A8781";
const ctx = document.getElementById("c").getContext("2d");
ctx.fillStyle = PAPER; ctx.fillRect(0,0,700,460);
ctx.imageSmoothingEnabled = false;

function rows(k){ return G[k].trim().split("\n").map(s=>s.trim()); }
function draw(k, x, y, s){
  const r = rows(k);
  ctx.fillStyle = INK;
  for (let j=0;j<r.length;j++) for (let i=0;i<r[j].length;i++)
    if (r[j][i] === "#") ctx.fillRect(x+i*s, y+j*s, s, s);
}
function label(t, x, y){
  ctx.fillStyle = TONE;
  ctx.font = "10px ui-monospace, Menlo, monospace";
  ctx.fillText(t, x, y);
}
const NAMES = ["STEVE","JEAN","KIM","YE","FRANK","QUENT"];

/* 8x — the two silhouette extremes */
draw("STEVE", 40, 30, 8);  label("STEVE / JOBS  8x", 40, 200);
draw("JEAN", 200, 30, 8);  label("JEAN / BASQUIAT  8x", 200, 200);

/* the sanity check: is any pixel not ink or paper */
label("two tones only. ink #0E0D0B on paper #FAF8F4.", 380, 40);
label("bone marks are holes cut in ink, enclosed on four sides.", 380, 56);
label("row 7 is the eye line. row 12 is the neck. row 11 is the jaw.", 380, 72);

/* 4x — the size crew.js paints at */
NAMES.forEach((n,i)=>{ draw(n, 40+i*100, 240, 4); label(n+"  4x", 40+i*100, 325); });

/* 1x — the read that killed the first pass */
NAMES.forEach((n,i)=>{ draw(n, 40+i*100, 360, 1); label(n+"  1x", 40+i*100, 400); });
</script>
